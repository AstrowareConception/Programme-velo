name: Verify Vercel production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify the deployed commit
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          for attempt in $(seq 1 30); do
            ACTUAL_SHA=$(curl --silent --fail --max-time 15 "https://programme-velo.vercel.app/api/version?expected=$EXPECTED_SHA" | python -c 'import json,sys; print(json.load(sys.stdin).get("commit", ""))' || true)
            if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
              echo "Production exposes verified commit $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "Production does not expose expected commit $EXPECTED_SHA (observed $ACTUAL_SHA)."
          exit 1
